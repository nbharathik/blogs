---
layout: default
---

<div class="container">
  <section class="archive-section">
    <h1>{{ page.title }}</h1>
    <p class="archive-desc">Posts in {{ page.type }} "{{ page.title }}"</p>

    <ul class="post-list">
      {% for post in page.posts %}
        {% include post-card.html %}
      {% endfor %}
    </ul>
  </section>
</div>
