<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{ site.baseurl }}/assets/images/logo.png">

{% seo %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v={{ site.time | date: '%s' }}">

<script>
  (function() {
    var theme = localStorage.getItem('theme');
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Centralized viz palette: window.Viz.colors() consumed by all canvas demos.
     Colors trace back to CSS variables in assets/css/style.css. -->
<script src="{{ site.baseurl }}/assets/js/viz-colors.js"></script>

{% if jekyll.environment == "production" and site.google_analytics %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  // URL-based opt-out: visit ?ga-opt-out=1 to disable, ?ga-opt-out=0 to re-enable.
  try {
    var p = new URLSearchParams(window.location.search).get('ga-opt-out');
    if (p === '1') { localStorage.setItem('ga-opt-out', '1'); }
    else if (p === '0') { localStorage.removeItem('ga-opt-out'); }
  } catch (e) {}

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  if (localStorage.getItem('ga-opt-out') !== '1') {
    gtag('config', '{{ site.google_analytics }}');
  }
</script>
{% endif %}
