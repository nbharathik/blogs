# Site settings
name: "Bharathi Kannan"
title: "Bharathi Kannan"
description: "PhD Student at University of Rostock — writing about AI, Machine Learning, LLMs, and Computer Vision."
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
baseurl: /blogs
url: "https://bharathikannann.github.io"
permalink: /:title/

# Author
author:
  name: Bharathi Kannan Nithyanantham
  short_name: Bharathi Kannan
  role: PhD Student
  affiliation: University of Rostock
  location: Rostock, Germany
  bio: "Researching at the intersection of Large Language Models and Multimodal AI. Focus areas include tool-augmented LLMs, multimodal spatial reasoning, and generative methods for BIM/CAD automation."
  avatar: 'assets/images/bharathikannan.png'
  email: bharathikannanhs@gmail.com
  github: https://github.com/bharathikannann
  github_username: bharathikannann
  linkedin: https://www.linkedin.com/in/bharathikannann/
  twitter: https://twitter.com/bharathik_n
  scholar: https://scholar.google.com/citations?user=cJnFLboAAAAJ&hl=en
  website: https://nbharathik.github.io/
  interests:
    - Large Language Models
    - Multimodal AI
    - Computer Vision
    - Tool-augmented LLMs
    - BIM/CAD Automation

# Post authors (for multi-author support in posts)
authors:
  bharathikannan:
    name: Bharathi Kannan
    display_name: Bharathi Kannan
    avatar: 'assets/images/bharathikannan.png'
    web: https://nbharathik.github.io/
    twitter: https://twitter.com/bharathik_n
    description: "PhD Student at University of Rostock. Researching LLMs, Multimodal AI, and Computer Vision."
  chatgpt:
    name: ChatGPT
    display_name: ChatGPT
    avatar: 'assets/images/openai-logo.png'
    web: https://chat.openai.com/
    description: "Written with ChatGPT."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'

# Pagination
paginate: 10
paginate_path: /page:num/

# Markdown
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Build
include: ["_pages"]
exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, docker-compose.yml, .claude]
